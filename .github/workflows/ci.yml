name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Tests and Workers bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Package the tested Worker and static assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/worker/commit.txt
          sha256sum dist/worker/index.js > dist/worker/bundle.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: verified-worker
          path: |
            dist/worker/index.js
            dist/worker/commit.txt
            dist/worker/bundle.sha256
            worker-assets/
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FREE_RUNTIME_VERIFIED == 'true' && vars.D1_MIGRATION_VERIFIED == 'true' && vars.FREE_PLAN_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: onwork-workers-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      FREE_AUTH_CODE_SHA256: ${{ vars.FREE_AUTH_CODE_SHA256 }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-worker
          path: .
      - name: Require the latest tested commit and verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat dist/worker/commit.txt)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          sha256sum --check dist/worker/bundle.sha256
      - name: Check account, environment isolation and Free authentication attestation
        run: |
          node scripts/cloudflare-config.mjs production
          node scripts/cloudflare-free-plan.mjs
      # DB migrations/import/restore are separate cutover steps.
      # Code deployment never initializes, reseeds or replaces the production DB.
      - run: npx wrangler deploy dist/worker/index.js --no-bundle --env production
